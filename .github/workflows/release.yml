name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.4)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Bump version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          CURRENT=$(node -p "require('./server/package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('./server/package.json'));
              p.version = process.env.VERSION;
              fs.writeFileSync('./server/package.json', JSON.stringify(p, null, 2) + '\n');
              const l = JSON.parse(fs.readFileSync('./server/package-lock.json'));
              l.version = process.env.VERSION;
              if (l.packages && l.packages['']) l.packages[''].version = process.env.VERSION;
              fs.writeFileSync('./server/package-lock.json', JSON.stringify(l, null, 2) + '\n');
            "
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add server/package.json server/package-lock.json
            git commit -m "chore: bump version to ${VERSION} [skip ci]"
            git push
            echo "Bumped $CURRENT → $VERSION"
          else
            echo "Version already at $VERSION, skipping bump"
          fi

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" \
              | grep -v '\[skip ci\]' \
              | grep -v '^- chore: bump version' \
              | grep -v '^- web: bump webpage' \
              || true)
          else
            NOTES="Initial release"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Maintenance release"
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Generated notes:"
          echo "$NOTES"

      - name: Cache pkg targets
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-node18-${{ runner.os }}

      - name: Build amd64
        run: chmod +x build/build.sh && ./build/build.sh amd64

      - name: Build arm64
        run: ./build/build.sh arm64

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          RELEASE_NOTES: ${{ steps.notes.outputs.NOTES }}
        run: chmod +x build/release.sh && ./build/release.sh "$VERSION"

      - name: Update webpage version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i "s/Download v[0-9]*\.[0-9]*\.[0-9]*/Download v${VERSION}/g" webpage/index.html
          sed -i "s/Download DABcast v[0-9]*\.[0-9]*\.[0-9]*/Download DABcast v${VERSION}/g" webpage/index.html
          sed -i "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/dabcast_[0-9]*\.[0-9]*\.[0-9]*_amd64\.deb|releases/download/v${VERSION}/dabcast_${VERSION}_amd64.deb|g" webpage/index.html
          sed -i "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/dabcast_[0-9]*\.[0-9]*\.[0-9]*_arm64\.deb|releases/download/v${VERSION}/dabcast_${VERSION}_arm64.deb|g" webpage/index.html
          sed -i "s/dpkg -i dabcast_[0-9]*\.[0-9]*\.[0-9]*_amd64\.deb/dpkg -i dabcast_${VERSION}_amd64.deb/g" webpage/index.html
          sed -i "s/[0-9]*\.[0-9]*\.[0-9]*/${VERSION}/g" webpage/download/DABcast_Guide.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webpage/index.html webpage/download/DABcast_Guide.html
          git diff --staged --quiet || git commit -m "web: bump webpage to v${VERSION}"
          git push
