name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.2)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(node -p "require('./server/package.json').version")" >> $GITHUB_OUTPUT
          fi

      - name: Cache pkg targets
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-node18-${{ runner.os }}

      - name: Build amd64
        run: chmod +x build/build.sh && ./build/build.sh amd64

      - name: Build arm64
        run: ./build/build.sh arm64

      - name: Publish release to DABcast-diffusion-software
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: chmod +x build/release.sh && ./build/release.sh "$VERSION"

      - name: Update webpage version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i "s/Download v[0-9]*\.[0-9]*\.[0-9]*/Download v${VERSION}/g" webpage/index.html
          sed -i "s/Download DABcast v[0-9]*\.[0-9]*\.[0-9]*/Download DABcast v${VERSION}/g" webpage/index.html
          sed -i "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/dabcast_[0-9]*\.[0-9]*\.[0-9]*_amd64\.deb|releases/download/v${VERSION}/dabcast_${VERSION}_amd64.deb|g" webpage/index.html
          sed -i "s|releases/download/v[0-9]*\.[0-9]*\.[0-9]*/dabcast_[0-9]*\.[0-9]*\.[0-9]*_arm64\.deb|releases/download/v${VERSION}/dabcast_${VERSION}_arm64.deb|g" webpage/index.html
          sed -i "s/dpkg -i dabcast_[0-9]*\.[0-9]*\.[0-9]*_amd64\.deb/dpkg -i dabcast_${VERSION}_amd64.deb/g" webpage/index.html
          sed -i "s/[0-9]*\.[0-9]*\.[0-9]*/${VERSION}/g" webpage/download/DABcast_Guide.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webpage/index.html webpage/download/DABcast_Guide.html
          git diff --staged --quiet || git commit -m "web: bump webpage to v${VERSION} [skip ci]"
          git push
