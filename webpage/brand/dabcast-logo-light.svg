<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8c4"/><stop offset="1" stop-color="#7ed321"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/><stop offset="1" stop-color="#161a23"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- radio waves from the antenna tip -->
  <linearGradient id="gw" gradientUnits="userSpaceOnUse" x1="140" y1="0" x2="240" y2="0"><stop offset="0" stop-color="#14b8c4"/><stop offset="1" stop-color="#7ed321"/></linearGradient>
  <g fill="none" stroke="url(#gw)" stroke-linecap="round" stroke-width="7">
    <path d="M150 34 a22 22 0 0 1 0 36" opacity="1"/>
    <path d="M164 22 a38 38 0 0 1 0 60" opacity=".75"/>
    <path d="M178 10 a54 54 0 0 1 0 84" opacity=".5"/>
  </g>
  <!-- antenna held by the penguin -->
  <line x1="136" y1="52" x2="136" y2="118" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <circle cx="136" cy="52" r="8" fill="url(#g)"/>

  <!-- penguin -->
  <g>
    <!-- feet -->
    <ellipse cx="62" cy="200" rx="24" ry="10" fill="url(#beak)"/>
    <ellipse cx="108" cy="200" rx="24" ry="10" fill="url(#beak)"/>
    <!-- body -->
    <path d="M85 40 C55 40 44 66 46 92 C47 108 36 124 30 146 C24 172 38 198 85 198 C132 198 146 172 140 146 C134 124 123 108 124 92 C126 66 115 40 85 40 Z" fill="url(#body)" stroke="#64748b" stroke-width="2.5"/>
    <!-- belly -->
    <path d="M85 98 C62 98 52 126 52 152 C52 178 66 190 85 190 C104 190 118 178 118 152 C118 126 108 98 85 98 Z" fill="#f8fafc"/>
    <!-- left flipper -->
    <path d="M44 120 C30 136 26 156 32 168 C40 160 46 146 50 132 Z" fill="#11151d"/>
    <!-- right flipper raised to the antenna -->
    <path d="M122 122 C130 116 136 112 140 112 C144 116 140 124 132 132 C128 136 124 138 120 138 Z" fill="#11151d"/>
    <!-- eyes -->
    <ellipse cx="73" cy="72" rx="10" ry="13" fill="#fff"/>
    <ellipse cx="97" cy="72" rx="10" ry="13" fill="#fff"/>
    <ellipse cx="76" cy="75" rx="4.5" ry="6" fill="#0d1017"/>
    <ellipse cx="94" cy="75" rx="4.5" ry="6" fill="#0d1017"/>
    <circle cx="77.5" cy="72.5" r="1.6" fill="#fff"/>
    <circle cx="95.5" cy="72.5" r="1.6" fill="#fff"/>
    <!-- beak -->
    <path d="M68 92 C72 84 98 84 102 92 C98 102 72 102 68 92 Z" fill="url(#beak)"/>
    <path d="M70 93 C78 96 92 96 100 93" stroke="#c2410c" stroke-width="1.6" fill="none"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="128" font-family="DejaVu Sans, Verdana, sans-serif" font-weight="700" font-size="76" letter-spacing="-2">
    <tspan fill="url(#g)">DAB</tspan><tspan fill="#1f2937">cast</tspan>
  </text>
  <text x="204" y="164" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.8" fill="#475569" letter-spacing="0.6">DAB+ BROADCAST MANAGER FOR ODR-mmbTools</text>
</svg>
